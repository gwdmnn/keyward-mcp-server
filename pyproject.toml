[project]
name = "db-mcp-server"
version = "0.1.0"
description = "Secure MCP server for routed, credential-isolated PostgreSQL access via SSH tunnels"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Guilherme Weidmann" }]
dependencies = [
    "mcp>=1.2",
    "psycopg[binary]>=3.1",
    "sshtunnel>=0.4",
    "cryptography>=42",
    "PyYAML>=6",
    "pydantic>=2",
    "fastmcp>=3.4.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
]

[project.scripts]
db-mcp-server = "db_mcp_server.server:main"
db-vault = "db_mcp_server.vault_admin:main"
db-bootstrap = "db_mcp_server.bootstrap:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
