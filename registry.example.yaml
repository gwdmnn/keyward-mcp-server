# registry.example.yaml — reference for the non-secret catalog.
#
# The real registry.yaml is GENERATED by `db-bootstrap` from bootstrap.yaml and
# is git-ignored (it carries environment-specific hosts). This example shows the
# shape: routing only — database names/hosts + secret_ref pointers, never
# credentials. The DB host is set per service (a customer's databases may be
# split across hosts); the tunnel block holds only the SSH jump-host settings.

defaults:
  max_rows: 1000
  statement_timeout_ms: 30000
  tunnel_idle_timeout_s: 300

customers:
  acme:
    environments:
      prod:
        tunnel:
          jump_host: 203.0.113.10
          jump_port: 22
          jump_user: tunnel
          pem_key: acme-prod-bastion.pem
        services:
          orders-api:
            dbname: orders
            db_host: orders-db.internal.example.com
            db_port: 5432
            secret_ref: acme/prod/orders-api
          users-api:
            dbname: users
            db_host: users-db.internal.example.com
            db_port: 5432
            secret_ref: acme/prod/users-api
